name: Export Dev Manifests via SSH

on:
  push:
    branches:
      - dev
    paths:
      - 'dev/**'
      - 'bootstrap/**'
      - 'scripts/**'
      - '.github/workflows/deploy-dev.yml'
  workflow_dispatch:

jobs:
  export-to-server:
    name: Export Dev Manifests to Remote Server
    runs-on: ubuntu-latest
    environment: cobroup

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 3. Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r scripts/requirements.txt

      - name: 4. Render and Validate Dev Manifests
        env:
          DEV_OPERATIONSDATABASE_CONNECTIONSTRING: ${{ vars.DEV_OPERATIONSDATABASE_CONNECTIONSTRING || secrets.DEV_OPERATIONSDATABASE_CONNECTIONSTRING }}
          DEV_IDENTITYDATABASE_CONNECTIONSTRING: ${{ vars.DEV_IDENTITYDATABASE_CONNECTIONSTRING || secrets.DEV_IDENTITYDATABASE_CONNECTIONSTRING }}
          GHCR_USERNAME: ${{ vars.GHCR_USERNAME || github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          python scripts/render_manifests.py --env dev

      - name: 5. Ensure Target Directories on Remote Server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            mkdir -p /opt/cobroup/deploys/dev
            mkdir -p /opt/cobroup/deploys/bootstrap

      - name: 6. Copy Dev Manifests to /opt/cobroup/deploys/dev via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "dev/*"
          target: "/opt/cobroup/deploys/dev"
          strip_components: 1
          overwrite: true

      - name: 7. Copy Bootstrap Manifests to /opt/cobroup/deploys/bootstrap via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "bootstrap/*"
          target: "/opt/cobroup/deploys/bootstrap"
          strip_components: 1
          overwrite: true

      - name: 8. Verify Files on Remote Server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            echo "Manifests successfully exported to /opt/cobroup/deploys/dev:"
            ls -la /opt/cobroup/deploys/dev
