name: Export QA Manifests via SSH

on:
  push:
    branches:
      - qa
    paths:
      - 'qa/**'
      - 'bootstrap/**'
      - '.github/workflows/deploy-qa.yml'
  workflow_dispatch:

jobs:
  export-to-server:
    name: Export QA Manifests to Remote Server
    runs-on: ubuntu-latest
    environment: cobroup

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Python for Variable Substitution
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 3. Replace Environment Placeholders in qa/ Manifests
        env:
          QA_OPERATIONSDATABASE_CONNECTIONSTRING: ${{ vars.QA_OPERATIONSDATABASE_CONNECTIONSTRING || secrets.QA_OPERATIONSDATABASE_CONNECTIONSTRING }}
          QA_IDENTITYDATABASE_CONNECTIONSTRING: ${{ vars.QA_IDENTITYDATABASE_CONNECTIONSTRING || secrets.QA_IDENTITYDATABASE_CONNECTIONSTRING }}
          QA_JWT_KEY_ID: ${{ vars.QA_JWT_KEY_ID || 'cobroup-qa-key-1' }}
          QA_JWT_PRIVATE_KEY_PEM: ${{ secrets.QA_JWT_PRIVATE_KEY_PEM }}
          GHCR_USERNAME: ${{ vars.GHCR_USERNAME || github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          python3 - << 'EOF'
          import os, base64, sys

          P = "${" + "{"
          S = "}}"

          replacements = {
              f"{P}Qa_OperationsDatabase__ConnectionString{S}": os.environ.get("QA_OPERATIONSDATABASE_CONNECTIONSTRING", ""),
              f"{P}Qa_IdentityDatabase__ConnectionString{S}": os.environ.get("QA_IDENTITYDATABASE_CONNECTIONSTRING", ""),
              f"{P}Qa_Jwt__KeyId{S}": os.environ.get("QA_JWT_KEY_ID", ""),
              f"{P}Qa_Jwt__PrivateKeyPem{S}": os.environ.get("QA_JWT_PRIVATE_KEY_PEM", ""),
          }

          unresolved = []

          # Scan all yaml/yml files in qa directory
          for root, dirs, files in os.walk("qa"):
              for file in files:
                  if file.endswith((".yaml", ".yml")):
                      filepath = os.path.join(root, file)
                      with open(filepath, "r", encoding="utf-8") as f:
                          content = f.read()

                      modified = content
                      for placeholder, value in replacements.items():
                          if value and placeholder in modified:
                              modified = modified.replace(placeholder, value)
                              print(f"Replaced {placeholder} in {filepath}")

                      # Also substitute ghcr credentials if available
                      ghcr_user = os.environ.get("GHCR_USERNAME")
                      ghcr_token = os.environ.get("GHCR_TOKEN")
                      if ghcr_user and ghcr_token and file == "ghcr-secret.yaml":
                          auth_b64 = base64.b64encode(f"{ghcr_user}:{ghcr_token}".encode("utf-8")).decode("utf-8")
                          modified = modified.replace("CHANGE_ME_GITHUB_USER", ghcr_user)
                          modified = modified.replace("CHANGE_ME_GITHUB_PAT", ghcr_token)
                          modified = modified.replace("CHANGE_ME", auth_b64)
                          print(f"Injected GHCR credentials in {filepath}")

                      if modified != content:
                          with open(filepath, "w", encoding="utf-8") as f:
                              f.write(modified)

                      if "Jwt__" in modified and P in modified:
                          unresolved.append(filepath)

          if unresolved:
              sys.exit(f"Deployment failed: Unresolved JWT placeholders in {unresolved}")
          EOF

      - name: 4. Ensure Target Directories on Remote Server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            mkdir -p /opt/cobroup/deploys/qa
            mkdir -p /opt/cobroup/deploys/bootstrap

      - name: 5. Copy QA Manifests to /opt/cobroup/deploys/qa via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "qa/*"
          target: "/opt/cobroup/deploys/qa"
          strip_components: 1
          overwrite: true

      - name: 6. Copy Bootstrap Manifests to /opt/cobroup/deploys/bootstrap via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "bootstrap/*"
          target: "/opt/cobroup/deploys/bootstrap"
          strip_components: 1
          overwrite: true

      - name: 7. Verify Files on Remote Server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            echo "Manifests successfully exported to /opt/cobroup/deploys/qa:"
            ls -la /opt/cobroup/deploys/qa
