apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  namespace: cobroup-prod
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: cobroup
    environment: prod
data:
  API_URL: "https://api.cobroup.com"
  IDENTITY_URL: "https://auth.cobroup.com"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: cobroup-prod
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: cobroup
    environment: prod
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
      app.kubernetes.io/part-of: cobroup
      environment: prod
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: cobroup
        environment: prod
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: frontend
          image: ghcr.io/clepineuxp/mf-cobroup-frontend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: frontend-config
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: cobroup-prod
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: cobroup
    environment: prod
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: cobroup
    environment: prod
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
