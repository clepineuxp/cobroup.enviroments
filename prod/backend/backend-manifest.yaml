apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: cobroup-prod
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: cobroup
    environment: prod
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  ASPNETCORE_URLS: "http://+:8080"
  DOTNET_RUNNING_IN_CONTAINER: "true"
  Identity__Issuer: "https://auth.cobroup.com"
  Identity__Audience: "cobroup-api"
  Identity__JwksUri: "http://admin-backend:8080/api/v1/auth/.well-known/jwks.json"
  AdministrativeApi__BaseUrl: "http://admin-backend:8080"
  Logging__LogLevel__Default: "Information"
  Logging__LogLevel__Microsoft.AspNetCore: "Warning"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: cobroup-prod
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: cobroup
    environment: prod
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
      app.kubernetes.io/part-of: cobroup
      environment: prod
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/part-of: cobroup
        environment: prod
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: backend
          image: ghcr.io/clepineuxp/ms-cobroup-backend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: cobroup-prod
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: cobroup
    environment: prod
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: cobroup
    environment: prod
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
