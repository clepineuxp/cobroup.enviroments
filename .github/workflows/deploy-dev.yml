name: Deploy Dev Manifests via SSH

on:
  push:
    branches:
      - dev
    paths:
      - 'dev/**'
      - 'bootstrap/**'
      - 'scripts/**'
      - '.github/workflows/deploy-dev.yml'
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy-dev:
    name: Deploy Dev Manifests to Remote Cluster
    runs-on: ubuntu-latest
    environment: dev
    env:
      INGRESS_FRONTEND_HOST: ${{ vars.INGRESS_FRONTEND_HOST }}
      INGRESS_ADMIN_FRONTEND_HOST: ${{ vars.INGRESS_ADMIN_FRONTEND_HOST }}
      INGRESS_API_HOST: ${{ vars.INGRESS_API_HOST }}
      INGRESS_AUTH_HOST: ${{ vars.INGRESS_AUTH_HOST }}

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: 2. Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.12'

      - name: 3. Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r scripts/requirements.txt

      - name: 4. Run Security and Manifest Validation Gates
        run: |
          python -m unittest scripts/test_render_manifests.py -v
          python -m unittest scripts/test_verify_ssh_host.py -v

      - name: 5. Render and Validate Dev Manifests (Non-Sensitive)
        env:
          OPERATIONS_DATABASE_CONNECTIONSTRING: ${{ secrets.OPERATIONS_DATABASE_CONNECTIONSTRING }}
          IDENTITY_DATABASE_CONNECTIONSTRING: ${{ secrets.IDENTITY_DATABASE_CONNECTIONSTRING }}
          JWT_ACTIVE_SIGNING_KEY_BASE64: ${{ secrets.JWT_ACTIVE_SIGNING_KEY_BASE64 }}
          JWT_PREVIOUS_SIGNING_KEY_BASE64: ${{ secrets.JWT_PREVIOUS_SIGNING_KEY_BASE64 }}
          JWT_ACTIVE_KEY_ID: ${{ vars.JWT_ACTIVE_KEY_ID }}
          JWT_PREVIOUS_KEY_ID: ${{ vars.JWT_PREVIOUS_KEY_ID }}
          JWT_KEY_FINGERPRINTS_JSON: ${{ vars.JWT_KEY_FINGERPRINTS_JSON }}
          GHCR_USERNAME: ${{ vars.GHCR_USERNAME || github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
          KUBERNETES_NAMESPACE: ${{ vars.KUBERNETES_NAMESPACE || 'cobroup-dev' }}
          PVC_STORAGE_CLASS: ${{ vars.PVC_STORAGE_CLASS || 'local-path' }}
        run: |
          python scripts/render_manifests.py --env dev

      - name: 6. Deploy Dev Remotely with Strict SSH Pinning & Safe Rollout
        env:
          ENV: dev
          OPERATIONS_DATABASE_CONNECTIONSTRING: ${{ secrets.OPERATIONS_DATABASE_CONNECTIONSTRING }}
          IDENTITY_DATABASE_CONNECTIONSTRING: ${{ secrets.IDENTITY_DATABASE_CONNECTIONSTRING }}
          JWT_ACTIVE_SIGNING_KEY_BASE64: ${{ secrets.JWT_ACTIVE_SIGNING_KEY_BASE64 }}
          JWT_PREVIOUS_SIGNING_KEY_BASE64: ${{ secrets.JWT_PREVIOUS_SIGNING_KEY_BASE64 }}
          JWT_ACTIVE_KEY_ID: ${{ vars.JWT_ACTIVE_KEY_ID }}
          JWT_PREVIOUS_KEY_ID: ${{ vars.JWT_PREVIOUS_KEY_ID }}
          JWT_KEY_FINGERPRINTS_JSON: ${{ vars.JWT_KEY_FINGERPRINTS_JSON }}
          GHCR_USERNAME: ${{ vars.GHCR_USERNAME || github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
          KUBERNETES_NAMESPACE: ${{ vars.KUBERNETES_NAMESPACE || 'cobroup-dev' }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
          SSH_HOST_ED25519_FINGERPRINT: ${{ vars.SSH_HOST_ED25519_FINGERPRINT }}
        run: |
          bash scripts/deploy_remote.sh
