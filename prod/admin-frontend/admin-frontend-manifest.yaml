apiVersion: v1
kind: ConfigMap
metadata:
  name: admin-frontend-config
  namespace: cobroup-prod
  labels:
    app.kubernetes.io/name: admin-frontend
    app.kubernetes.io/part-of: cobroup
    environment: prod
data:
  API_URL: "https://__INGRESS_API_HOST__"
  IDENTITY_URL: "https://__INGRESS_AUTH_HOST__"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-frontend
  namespace: cobroup-prod
  labels:
    app.kubernetes.io/name: admin-frontend
    app.kubernetes.io/part-of: cobroup
    environment: prod
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: admin-frontend
      app.kubernetes.io/part-of: cobroup
      environment: prod
  template:
    metadata:
      labels:
        app.kubernetes.io/name: admin-frontend
        app.kubernetes.io/part-of: cobroup
        environment: prod
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: admin-frontend
          image: ghcr.io/clepineuxp/mf-cobroup-frontend-admin:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: admin-frontend-config
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: admin-frontend
  namespace: cobroup-prod
  labels:
    app.kubernetes.io/name: admin-frontend
    app.kubernetes.io/part-of: cobroup
    environment: prod
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: admin-frontend
    app.kubernetes.io/part-of: cobroup
    environment: prod
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
