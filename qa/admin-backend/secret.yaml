apiVersion: v1
kind: Secret
metadata:
  name: admin-backend-secret
  namespace: cobroup-qa
  labels:
    app.kubernetes.io/name: admin-backend
    app.kubernetes.io/part-of: cobroup
    environment: qa
type: Opaque
stringData:
  ConnectionStrings__IdentityDatabase: "${{Qa_IdentityDatabase__ConnectionString}}"
  Jwt__KeyId: "${{Qa_Jwt__KeyId}}"
  Jwt__PrivateKeyPem: "${{Qa_Jwt__PrivateKeyPem}}"
