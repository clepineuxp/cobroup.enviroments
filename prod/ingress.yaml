apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cobroup-ingress
  namespace: cobroup-prod
  labels:
    app.kubernetes.io/part-of: cobroup
    environment: prod
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "25m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - __INGRESS_FRONTEND_HOST__
        - __INGRESS_FRONTEND_ALIAS_HOST__
        - __INGRESS_ADMIN_FRONTEND_HOST__
        - __INGRESS_API_HOST__
        - __INGRESS_AUTH_HOST__
      secretName: cobroup-tls
  rules:
    # 1. PWA Recolector (Collector Frontend)
    - host: __INGRESS_FRONTEND_HOST__
      http:
        paths:
          - path: /api/operations
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 8080

    - host: __INGRESS_FRONTEND_ALIAS_HOST__
      http:
        paths:
          - path: /api/operations
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 8080

    # 2. Portal Administrativo (Admin Frontend)
    - host: __INGRESS_ADMIN_FRONTEND_HOST__
      http:
        paths:
          - path: /api/operations
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: admin-frontend
                port:
                  number: 8080

    # 3. Dedicated Operations API Domain
    - host: __INGRESS_API_HOST__
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080

    # 4. Dedicated Auth / Identity Domain
    - host: __INGRESS_AUTH_HOST__
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: admin-backend
                port:
                  number: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cobroup-ingress-identity-rewrite
  namespace: cobroup-prod
  labels:
    app.kubernetes.io/part-of: cobroup
    environment: prod
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/proxy-body-size: "25m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - __INGRESS_FRONTEND_HOST__
        - __INGRESS_FRONTEND_ALIAS_HOST__
        - __INGRESS_ADMIN_FRONTEND_HOST__
      secretName: cobroup-tls
  rules:
    - host: __INGRESS_FRONTEND_HOST__
      http:
        paths:
          - path: /identity(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: admin-backend
                port:
                  number: 8080
    - host: __INGRESS_FRONTEND_ALIAS_HOST__
      http:
        paths:
          - path: /identity(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: admin-backend
                port:
                  number: 8080
    - host: __INGRESS_ADMIN_FRONTEND_HOST__
      http:
        paths:
          - path: /identity(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: admin-backend
                port:
                  number: 8080
