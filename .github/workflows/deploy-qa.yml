name: Export QA Manifests via SSH

on:
  push:
    branches:
      - qa
    paths:
      - 'qa/**'
      - 'bootstrap/**'
      - 'scripts/**'
      - '.github/workflows/deploy-qa.yml'
  workflow_dispatch:

jobs:
  export-to-server:
    name: Export QA Manifests to Remote Server
    runs-on: ubuntu-latest
    environment: cobroup

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 3. Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r scripts/requirements.txt

      - name: 4. Render and Validate QA Manifests
        env:
          QA_OPERATIONSDATABASE_CONNECTIONSTRING: ${{ vars.QA_OPERATIONSDATABASE_CONNECTIONSTRING || secrets.QA_OPERATIONSDATABASE_CONNECTIONSTRING }}
          QA_IDENTITYDATABASE_CONNECTIONSTRING: ${{ vars.QA_IDENTITYDATABASE_CONNECTIONSTRING || secrets.QA_IDENTITYDATABASE_CONNECTIONSTRING }}
          QA_JWT_SIGNING_KEY_BASE64: ${{ secrets.QA_JWT_SIGNING_KEY_BASE64 }}
          GHCR_USERNAME: ${{ vars.GHCR_USERNAME || github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          python scripts/render_manifests.py --env qa

      - name: 5. Ensure Target Directories on Remote Server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            mkdir -p /opt/cobroup/deploys/qa
            mkdir -p /opt/cobroup/deploys/bootstrap

      - name: 6. Copy QA Manifests to /opt/cobroup/deploys/qa via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "qa/*"
          target: "/opt/cobroup/deploys/qa"
          strip_components: 1
          overwrite: true

      - name: 7. Copy Bootstrap Manifests to /opt/cobroup/deploys/bootstrap via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "bootstrap/*"
          target: "/opt/cobroup/deploys/bootstrap"
          strip_components: 1
          overwrite: true

      - name: 8. Verify Files on Remote Server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            echo "Manifests successfully exported to /opt/cobroup/deploys/qa:"
            ls -la /opt/cobroup/deploys/qa
