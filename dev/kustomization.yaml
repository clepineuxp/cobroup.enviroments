apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cobroup-dev

resources:
  - backend/backend-manifest.yaml
  - backend/secret.yaml
  - admin-backend/admin-backend-manifest.yaml
  - admin-backend/secret.yaml
  - frontend/frontend-manifest.yaml
  - frontend/secret.yaml
  - admin-frontend/admin-frontend-manifest.yaml
  - admin-frontend/secret.yaml
  - ingress.yaml
  - ghcr-secret.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: cobroup
      environment: dev
