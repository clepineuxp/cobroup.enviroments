apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backend-evidence-pvc
  namespace: cobroup-dev
  labels:
    app.kubernetes.io/name: backend-evidence-storage
    app.kubernetes.io/part-of: cobroup
    environment: dev
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
