apiVersion: v1
kind: ConfigMap
metadata:
  name: admin-backend-config
  namespace: cobroup-dev
  labels:
    app.kubernetes.io/name: admin-backend
    app.kubernetes.io/part-of: cobroup
    environment: dev
data:
  ASPNETCORE_ENVIRONMENT: "Development"
  ASPNETCORE_URLS: "http://+:8080"
  DOTNET_RUNNING_IN_CONTAINER: "true"
  Identity__Issuer: "https://dev-auth.cobroup.com"
  Identity__Audience: "cobroup-api"
  OperationalApi__BaseUrl: "http://backend:8080"
  Logging__LogLevel__Default: "Information"
  Logging__LogLevel__Microsoft.AspNetCore: "Warning"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-backend
  namespace: cobroup-dev
  labels:
    app.kubernetes.io/name: admin-backend
    app.kubernetes.io/part-of: cobroup
    environment: dev
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: admin-backend
      app.kubernetes.io/part-of: cobroup
      environment: dev
  template:
    metadata:
      labels:
        app.kubernetes.io/name: admin-backend
        app.kubernetes.io/part-of: cobroup
        environment: dev
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: admin-backend
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
          image: ghcr.io/clepineuxp/ms-cobroup-backendadmin:dev
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: admin-backend-config
            - secretRef:
                name: admin-backend-secret
            - secretRef:
                name: jwt-signing-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: admin-backend
  namespace: cobroup-dev
  labels:
    app.kubernetes.io/name: admin-backend
    app.kubernetes.io/part-of: cobroup
    environment: dev
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: admin-backend
    app.kubernetes.io/part-of: cobroup
    environment: dev
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
