apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: cobroup-prod
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: cobroup
    environment: prod
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  ASPNETCORE_URLS: "http://+:8080"
  DOTNET_RUNNING_IN_CONTAINER: "true"
  Identity__Issuer: "https://auth.cobroup.com"
  Identity__Audience: "cobroup-api"
  AdministrativeApi__BaseUrl: "http://admin-backend:8080"
  Storage__Provider: "FileSystem"
  Storage__EvidencePath: "/var/cobroup/evidences"
  Logging__LogLevel__Default: "Information"
  Logging__LogLevel__Microsoft.AspNetCore: "Warning"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backend-evidence-pvc
  namespace: cobroup-prod
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: cobroup
    environment: prod
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: standard
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: cobroup-prod
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: cobroup
    environment: prod
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
      app.kubernetes.io/part-of: cobroup
      environment: prod
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/part-of: cobroup
        environment: prod
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: backend
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
          image: ghcr.io/clepineuxp/ms-cobroup-backend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secret
            - secretRef:
                name: jwt-signing-secret
          volumeMounts:
            - name: backend-evidence-volume
              mountPath: /var/cobroup/evidences
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
      volumes:
        - name: backend-evidence-volume
          persistentVolumeClaim:
            claimName: backend-evidence-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: cobroup-prod
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: cobroup
    environment: prod
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: backend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
